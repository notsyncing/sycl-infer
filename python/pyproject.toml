[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sycl-infer"
version = "0.1.0"
description = "In-process SYCL LLM inference engine (C ABI + Python binding)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "sycl-infer contributors" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: C",
  "Operating System :: POSIX :: Linux",
]

[tool.setuptools]
packages = ["sycl_infer"]
include-package-data = true

[tool.setuptools.package-data]
sycl_infer = ["_lib/*", "py.typed"]
